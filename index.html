<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>KMO Motor Club</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        background: #050505;
        transition: opacity 0.6s ease;
      }
      #splash.kmo-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 180px;
        height: 180px;
        border-radius: 9999px;
        animation: kmo-splash-pulse 1.6s ease-in-out infinite;
      }
      #splash p {
        margin: 0;
        color: #8e8e94;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.9rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      @keyframes kmo-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 28px -6px rgba(212, 10, 10, 0.5);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 56px 2px rgba(212, 10, 10, 0.8);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash img {
          animation: none;
          box-shadow: 0 0 28px -6px rgba(212, 10, 10, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img src="./logo.webp" alt="KMO Motor Club" />
      <p>Cargando…</p>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('splash')
        if (!splash) return
        var seen = false
        try {
          seen = !!sessionStorage.getItem('kmo-splash-seen')
          sessionStorage.setItem('kmo-splash-seen', '1')
        } catch (e) {}
        if (seen) {
          splash.remove()
          return
        }
        setTimeout(function () {
          splash.classList.add('kmo-hide')
          setTimeout(function () {
            if (splash.parentNode) splash.remove()
          }, 650)
        }, 2500)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
